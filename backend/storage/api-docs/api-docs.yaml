components:
  schemas:
    AcademicRecordResource:
      properties:
        student:
          $ref: '#/components/schemas/StudentResource'
        terms:
          type: array
          items:
            properties:
              term:
                $ref: '#/components/schemas/AcademicTermResource'
              courses:
                type: array
                items:
                  properties:
                    course:
                      $ref: '#/components/schemas/CourseResource'
                    offering:
                      $ref: '#/components/schemas/CourseOfferingResource'
                    enrollment:
                      $ref: '#/components/schemas/EnrollmentResource'
                    grade:
                      oneOf:
                        -
                          $ref: '#/components/schemas/GradeResource'
                      nullable: true
                  type: object
            type: object
      type: object
    AcademicTermResource:
      properties:
        id:
          type: integer
        academic_year:
          type: string
        semester:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    CourseOfferingResource:
      properties:
        id:
          type: integer
        course_id:
          type: integer
        course:
          $ref: '#/components/schemas/CourseResource'
        academic_term_id:
          type: integer
        academic_term:
          $ref: '#/components/schemas/AcademicTermResource'
        instructor_id:
          type: integer
        instructor:
          $ref: '#/components/schemas/UserResource'
        section:
          type: string
        schedule:
          type: string
        room:
          type: string
        capacity:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    CourseResource:
      properties:
        id:
          type: integer
        course_code:
          type: string
        title:
          type: string
        units:
          type: number
          format: float
        description:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    EnrollmentResource:
      properties:
        id:
          type: integer
        student_id:
          type: integer
        student:
          $ref: '#/components/schemas/StudentResource'
        course_offering_id:
          type: integer
        course_offering:
          $ref: '#/components/schemas/CourseOfferingResource'
        enrollment_date:
          type: string
          format: date
        status:
          type: string
        grade:
          $ref: '#/components/schemas/GradeResource'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    GradeResource:
      properties:
        id:
          type: integer
        enrollment_id:
          type: integer
        enrollment:
          $ref: '#/components/schemas/EnrollmentResource'
        midterm_grade:
          type: number
          format: float
          nullable: true
        final_grade:
          type: number
          format: float
          nullable: true
        remarks:
          type: string
          nullable: true
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    ProgramResource:
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      type: object
    StudentResource:
      properties:
        id:
          type: integer
        student_number:
          type: string
        user_id:
          type: integer
          nullable: true
        first_name:
          type: string
        last_name:
          type: string
        middle_name:
          type: string
          nullable: true
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
        program_id:
          type: integer
        program:
          $ref: '#/components/schemas/ProgramResource'
        year_level:
          type: integer
        status:
          type: string
        created_at:
          type: string
          format: date-time
