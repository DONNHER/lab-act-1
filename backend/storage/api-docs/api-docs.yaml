openapi: 3.0.0
info:
  title: 'Student Services Portal API'
  description: 'Student Information Management REST API for Student Services Portal'
  version: 1.0.0
servers:
  -
    url: /api/v1
paths:
  '/students/{id}/academic-record':
    get:
      tags:
        - 'Academic Records'
      summary: 'Get student academic record'
      description: "Get a student's academic record grouped by term with courses, grades, and enrollment status"
      operationId: b92bdd13ad00185c239a1a4009ccc850
      parameters:
        -
          name: id
          in: path
          description: 'Student ID'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Academic record'
          content:
            application/json:
              schema:
                properties:
                  student:
                    properties:
                      id:
                        type: integer
                      student_number:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      middle_name:
                        type: string
                        nullable: true
                      program:
                        type: object
                        nullable: true
                      year_level:
                        type: integer
                      status:
                        type: string
                    type: object
                  terms:
                    type: array
                    items:
                      type: object
                type: object
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
      security:
        -
          sanctum: []
  /academic-terms:
    get:
      tags:
        - 'Academic Terms'
      summary: 'List academic terms'
      description: 'Get paginated list of academic terms with search, filter, sort, and pagination'
      operationId: fe6b39788f66c81c46e062dc1e226d20
      parameters:
        -
          name: search
          in: query
          description: 'Search by academic year'
          schema:
            type: string
        -
          name: status
          in: query
          description: 'Filter by status'
          schema:
            type: string
            enum:
              - PLANNED
              - OPEN
              - CLOSED
        -
          name: sort
          in: query
          description: 'Sort column (prefix with - for desc)'
          schema:
            type: string
            enum:
              - academic_year
              - semester
              - start_date
              - end_date
              - status
              - created_at
              - '-academic_year'
              - '-semester'
              - '-start_date'
              - '-end_date'
              - '-status'
              - '-created_at'
        -
          name: per_page
          in: query
          description: 'Items per page (max 100)'
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
        -
          name: page
          in: query
          description: 'Page number'
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        200:
          description: 'Paginated list of academic terms'
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AcademicTermResource'
                  links:
                    type: object
                  meta:
                    type: object
                type: object
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        422:
          description: 'Validation error'
      security:
        -
          sanctum: []
    post:
      tags:
        - 'Academic Terms'
      summary: 'Create academic term'
      description: 'Create a new academic term record'
      operationId: e07fdc6b89e2b21e582ab3d6680a1539
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - academic_year
                - semester
                - start_date
                - end_date
              properties:
                academic_year:
                  type: string
                  example: 2024-2025
                semester:
                  type: string
                  enum:
                    - 1st
                    - 2nd
                    - Summer
                start_date:
                  type: string
                  format: date
                  example: '2024-08-01'
                end_date:
                  type: string
                  format: date
                  example: '2024-12-15'
                status:
                  type: string
                  default: PLANNED
                  enum:
                    - PLANNED
                    - OPEN
                    - CLOSED
              type: object
      responses:
        201:
          description: 'Academic term created'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        422:
          description: 'Validation error'
      security:
        -
          sanctum: []
  '/academic-terms/{id}':
    get:
      tags:
        - 'Academic Terms'
      summary: 'Get academic term'
      description: 'Get a single academic term by ID'
      operationId: 49b8e938a666911fe6c1111f88e02c12
      parameters:
        -
          name: id
          in: path
          description: 'Academic Term ID'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Academic term details'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
      security:
        -
          sanctum: []
    delete:
      tags:
        - 'Academic Terms'
      summary: 'Close academic term'
      description: 'Close an academic term (sets status to CLOSED)'
      operationId: b867954860c884cad51c30527d83c52c
      parameters:
        -
          name: id
          in: path
          description: 'Academic Term ID'
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Academic term closed'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
      security:
        -
          sanctum: []
    patch:
      tags:
        - 'Academic Terms'
      summary: 'Update academic term'
      description: 'Update an academic term record'
      operationId: 87b240d380c2ee91843e3e32e99f346f
      parameters:
        -
          name: id
          in: path
          description: 'Academic Term ID'
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                academic_year:
                  type: string
                semester:
                  type: string
                  enum:
                    - 1st
                    - 2nd
                    - Summer
                start_date:
                  type: string
                  format: date
                end_date:
                  type: string
                  format: date
                status:
                  type: string
                  enum:
                    - PLANNED
                    - OPEN
                    - CLOSED
              type: object
      responses:
        200:
          description: 'Academic term updated'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
        422:
          description: 'Validation error'
      security:
        -
          sanctum: []
  /auth/login:
    post:
      tags:
        - Authentication
      summary: 'User login'
      description: 'Validate credentials and issue a Sanctum bearer token'
      operationId: 985cd5203e2d0a820e113f2f4fdb2847
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: admin@example.com
                password:
                  type: string
                  format: password
                  example: password123
              type: object
      responses:
        200:
          description: 'Login successful'
          content:
            application/json:
              schema:
                properties:
                  user:
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      email:
                        type: string
                      role:
                        type: string
                        enum:
                          - ADMIN
                          - REGISTRAR
                          - INSTRUCTOR
                          - STUDENT
                      status:
                        type: string
                        enum:
                          - ACTIVE
                          - INACTIVE
                    type: object
                  token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
                type: object
        422:
          description: 'Validation error'
        403:
          description: 'Account inactive'
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: 'User logout'
      description: 'Revoke the current bearer token'
      operationId: a05022a34eef599e04fb0a5254375b84
      responses:
        200:
          description: 'Logout successful'
          content:
            application/json:
              schema:
                properties:
                  message:
                    type: string
                    example: 'Logged out successfully.'
                type: object
        401:
          description: Unauthenticated
      security:
        -
          sanctum: []
  /auth/me:
    get:
      tags:
        - Authentication
      summary: 'Get authenticated user profile'
      description: "Return the authenticated user's safe profile"
      operationId: e339e0e74860c0647fd1d41bbbbc13b2
      responses:
        200:
          description: 'User profile'
          content:
            application/json:
              schema:
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  email:
                    type: string
                  role:
                    type: string
                    enum:
                      - ADMIN
                      - REGISTRAR
                      - INSTRUCTOR
                      - STUDENT
                  status:
                    type: string
                    enum:
                      - ACTIVE
                      - INACTIVE
                  email_verified_at:
                    type: string
                    format: date-time
                    nullable: true
                  created_at:
                    type: string
                    format: date-time
                type: object
        401:
          description: Unauthenticated
      security:
        -
          sanctum: []
  /courses:
    get:
      tags:
        - Courses
      summary: 'List courses'
      description: 'Get paginated list of courses with search, filter, sort, and pagination'
      operationId: ca402a4507e954e8b1395d13384bfa8f
      parameters:
        -
          name: search
          in: query
          description: 'Search by course code or title'
          schema:
            type: string
        -
          name: status
          in: query
          description: 'Filter by status'
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
        -
          name: sort
          in: query
          description: 'Sort column (prefix with - for desc)'
          schema:
            type: string
            enum:
              - course_code
              - title
              - units
              - status
              - created_at
              - '-course_code'
              - '-title'
              - '-units'
              - '-status'
              - '-created_at'
        -
          name: per_page
          in: query
          description: 'Items per page (max 100)'
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
        -
          name: page
          in: query
          description: 'Page number'
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        200:
          description: 'Paginated list of courses'
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseResource'
                  links:
                    type: object
                  meta:
                    type: object
                type: object
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        422:
          description: 'Validation error'
      security:
        -
          sanctum: []
    post:
      tags:
        - Courses
      summary: 'Create course'
      description: 'Create a new course record'
      operationId: 2e1fd9099f78ca1991e4e7d18517a804
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - course_code
                - title
                - units
              properties:
                course_code:
                  type: string
                  example: CS101
                title:
                  type: string
                  example: 'Introduction to Computer Science'
                units:
                  type: number
                  format: float
                  example: 3
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  default: ACTIVE
                  enum:
                    - ACTIVE
                    - INACTIVE
              type: object
      responses:
        201:
          description: 'Course created'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        422:
          description: 'Validation error'
      security:
        -
          sanctum: []
  '/courses/{id}':
    get:
      tags:
        - Courses
      summary: 'Get course'
      description: 'Get a single course by ID'
      operationId: 29d892799406317013a6c4e06a7eca2c
      parameters:
        -
          name: id
          in: path
          description: 'Course ID'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Course details'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
      security:
        -
          sanctum: []
    delete:
      tags:
        - Courses
      summary: 'Deactivate course'
      description: 'Deactivate a course (sets status to INACTIVE)'
      operationId: 733789883eb558e905c2f59efd6ce25f
      parameters:
        -
          name: id
          in: path
          description: 'Course ID'
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Course deactivated'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
      security:
        -
          sanctum: []
    patch:
      tags:
        - Courses
      summary: 'Update course'
      description: 'Update a course record'
      operationId: c539f3213eddc674f6922848dc436915
      parameters:
        -
          name: id
          in: path
          description: 'Course ID'
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                course_code:
                  type: string
                title:
                  type: string
                units:
                  type: number
                  format: float
                description:
                  type: string
                  nullable: true
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - INACTIVE
              type: object
      responses:
        200:
          description: 'Course updated'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
        422:
          description: 'Validation error'
      security:
        -
          sanctum: []
  /course-offerings:
    get:
      tags:
        - 'Course Offerings'
      summary: 'List course offerings'
      description: 'Get paginated list of course offerings with search, filter, sort, and pagination'
      operationId: 807af839c7664fe4a521c363c64b59e8
      parameters:
        -
          name: search
          in: query
          description: 'Search by course code or title'
          schema:
            type: string
        -
          name: course_id
          in: query
          description: 'Filter by course ID'
          schema:
            type: integer
        -
          name: academic_term_id
          in: query
          description: 'Filter by academic term ID'
          schema:
            type: integer
        -
          name: instructor_id
          in: query
          description: 'Filter by instructor ID'
          schema:
            type: integer
        -
          name: status
          in: query
          description: 'Filter by status'
          schema:
            type: string
            enum:
              - OPEN
              - CLOSED
              - CANCELLED
        -
          name: sort
          in: query
          description: 'Sort column (prefix with - for desc)'
          schema:
            type: string
            enum:
              - section
              - capacity
              - status
              - created_at
              - '-section'
              - '-capacity'
              - '-status'
              - '-created_at'
        -
          name: per_page
          in: query
          description: 'Items per page (max 100)'
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
        -
          name: page
          in: query
          description: 'Page number'
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        200:
          description: 'Paginated list of course offerings'
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseOfferingResource'
                  links:
                    type: object
                  meta:
                    type: object
                type: object
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        422:
          description: 'Validation error'
      security:
        -
          sanctum: []
    post:
      tags:
        - 'Course Offerings'
      summary: 'Create course offering'
      description: 'Create a new course offering record'
      operationId: f2a0a791767e5f189508fd4cdc7a4d10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - course_id
                - academic_term_id
                - instructor_id
                - section
                - capacity
              properties:
                course_id:
                  type: integer
                academic_term_id:
                  type: integer
                instructor_id:
                  type: integer
                section:
                  type: string
                  example: A
                schedule:
                  type: string
                  example: 'MWF 10:00-11:00'
                  nullable: true
                room:
                  type: string
                  example: 'Room 101'
                  nullable: true
                capacity:
                  type: integer
                  example: 30
                  minimum: 1
                status:
                  type: string
                  default: OPEN
                  enum:
                    - OPEN
                    - CLOSED
                    - CANCELLED
              type: object
      responses:
        201:
          description: 'Course offering created'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        422:
          description: 'Validation error'
      security:
        -
          sanctum: []
  '/course-offerings/{id}':
    get:
      tags:
        - 'Course Offerings'
      summary: 'Get course offering'
      description: 'Get a single course offering by ID'
      operationId: 38cfca001c38ee6684752a8192e13297
      parameters:
        -
          name: id
          in: path
          description: 'Course Offering ID'
          required: true
          schema:
            type: integer
      responses:
        200:
          description: 'Course offering details'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
      security:
        -
          sanctum: []
    delete:
      tags:
        - 'Course Offerings'
      summary: 'Cancel course offering'
      description: 'Cancel a course offering (sets status to CANCELLED)'
      operationId: 775819ceae62be103b45ff0c7c9c1b8c
      parameters:
        -
          name: id
          in: path
          description: 'Course Offering ID'
          required: true
          schema:
            type: integer
      responses:
        204:
          description: 'Course offering cancelled'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
      security:
        -
          sanctum: []
    patch:
      tags:
        - 'Course Offerings'
      summary: 'Update course offering'
      description: 'Update a course offering record'
      operationId: 699da135bb8d029dffbdae8fe59d23c0
      parameters:
        -
          name: id
          in: path
          description: 'Course Offering ID'
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              properties:
                course_id:
                  type: integer
                academic_term_id:
                  type: integer
                instructor_id:
                  type: integer
                section:
                  type: string
                schedule:
                  type: string
                  nullable: true
                room:
                  type: string
                  nullable: true
                capacity:
                  type: integer
                  minimum: 1
                status:
                  type: string
                  enum:
                    - OPEN
                    - CLOSED
                    - CANCELLED
              type: object
      responses:
        200:
          description: 'Course offering updated'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
        422:
          description: 'Validation error'
      security:
        -
          sanctum: []
  /enrollments:
    get:
      tags:
        - Enrollments
      summary: 'List enrollments'
      description: 'Get paginated list of enrollments with search, filter, sort, and pagination'
      operationId: 510cef6570a4ba99e63ebc8f79147943
      parameters:
        -
          name: search
          in: query
          description: 'Search by student number or name'
          schema:
            type: string
        -
          name: student_id
          in: query
          description: 'Filter by student ID'
          schema:
            type: integer
        -
          name: course_offering_id
          in: query
          description: 'Filter by course offering ID'
          schema:
            type: integer
        -
          name: status
          in: query
          description: 'Filter by status'
          schema:
            type: string
            enum:
              - ENROLLED
              - DROPPED
              - COMPLETED
        -
          name: sort
          in: query
          description: 'Sort column (prefix with - for desc)'
          schema:
            type: string
            enum:
              - enrollment_date
              - status
              - created_at
              - '-enrollment_date'
              - '-status'
              - '-created_at'
        -
          name: per_page
          in: query
          description: 'Items per page (max 100)'
          schema:
            type: integer
            default: 20
            maximum: 100
            minimum: 1
        -
          name: page
          in: query
          description: 'Page number'
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        200:
          description: 'Paginated list of enrollments'
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EnrollmentResource'
                  links:
                    type: object
                  meta:
                    type: object
                type: object
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        422:
          description: 'Validation error'
      security:
        -
          sanctum: []
    post:
      tags:
        - Enrollments
      summary: 'Create enrollment'
      description: 'Create a new enrollment record'
      operationId: e72c8f309fdd066f05395c5f7365e96b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - student_id
                - course_offering_id
              properties:
                student_id:
                  type: integer
                course_offering_id:
                  type: integer
                enrollment_date:
                  type: string
                  format: date
                  example: '2024-08-01'
                status:
                  type: string
                  default: ENROLLED
                  enum:
                    - ENROLLED
                    - DROPPED
                    - COMPLETED
              type: object
      responses:
        201:
          description: 'Enrollment created'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        409:
          description: 'Conflict - duplicate enrollment or full capacity'
        422:
          description: 'Validation error'
      security:
        -
          sanctum: []
  '/enrollments/{id}':
    get:
      tags:
        - Enrollments
      summary: 'Get enrollment'
      description: 'Get a single enrollment by ID'
      operationId: 2b0508a1c84db4efb6d8fc0534f5bbd6
      responses:
        200:
          description: 'Enrollment details'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
      security:
        -
          sanctum: []
    patch:
      tags:
        - Enrollments
      summary: 'Update enrollment'
      description: 'Update an enrollment record'
      operationId: e0baba958186fc875a13813dbaacb05f
      requestBody:
        content:
          application/json:
            schema:
              properties:
                status:
                  type: string
                  enum:
                    - ENROLLED
                    - DROPPED
                    - COMPLETED
              type: object
      responses:
        200:
          description: 'Enrollment updated'
        401:
          description: Unauthenticated
        403:
          description: Forbidden
        404:
          description: 'Not found'
        422:
          description: 'Validation error'
      security:
        -
          sanctum: []
  /grades:
    get:
      tags:
        - Grades
      summary: 'List grades'
      description: 'Get paginated list of grades with search, filter, sort, and pagination'
      operationId: 45a91bd4601ddd947b574bbee91ae616
      parameters:
        -
          name: search
          in: query
          description: 'Search by student number or name'
          schema:
            type: string
        -
          name: enrollment_id
          in: query
          description: 'Filter by enrollment ID'
          schema:
            type: integer
        -
          name: status
          in: query
          description: 'Filter by status'
